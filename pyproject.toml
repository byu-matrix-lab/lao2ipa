[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["lao2ipa"]

[tool.setuptools.package-dir]
"" = "src"

[project]
name = "lao2ipa"
version = "1.0.0"
authors = [
  { name="Christian Richardson", email="richachr@byu.edu" },
]
description = "A package to transliterate Lao characters into a number of romanization systems, such as IPA and MoH2020"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["lao","transliterate","transliteration","ipa","lao2ipa","converter"]

[project.urls]
Homepage = "https://github.com/byu-matrix-lab/lao2ipa"
Issues = "https://github.com/byu-matrix-lab/lao2ipa/issues"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]